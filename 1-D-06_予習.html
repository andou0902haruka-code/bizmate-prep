const KEY = "bizprep_" + D.lesson;
const store = { get(k, d){ try{ const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
                set(k, v){ try{ localStorage.setItem(KEY + k, JSON.stringify(v)); }catch(e){} } };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
const plain = s => String(s ?? "").replace(/\*/g, "");
// ヒント = 各文の頭の3語 + …（JSONに hint があればそちらを優先）
const autoHint = s => plain(s).split(/(?<=[.!?])\s+/).filter(Boolean).map(x => { const w = x.split(/\s+/); return w.length > 3 ? w.slice(0, 3).join(" ") + " …" : x; }).join("　");
const say = t => `<button class="say" aria-label="読み上げ" data-say="${esc(plain(t))}">🔊</button>`;
const en = (text, hint) => `<div class="en s0">${say(text)}<span class="hn">${md(hint || autoHint(text))}</span><span class="txt">${md(text)}</span></div>`;
const pair = l => `<div class="pair"><div class="ja">${md(l.ja)}</div>${en(l.en, l.hint)}</div>`;
const list = (arr, tag = "ul") => `<${tag}>${arr.map(x => `<li>${md(x)}</li>`).join("")}</${tag}>`;

const talks = D.talks || [];
let h = `<h1>${esc(D.title)}</h1><div class="meta">${esc(D.lesson)}　｜　テーマ: ${esc(D.theme)}　｜　作成日: ${esc(D.date)}</div>`;
h += `<div class="bar">`;
if (talks.length > 1) h += `<div class="row"><span class="lb">内容</span>${talks.map((t, i) => `<button class="tabBtn" data-i="${i}">${esc(t.name)}</button>`).join("")}</div>`;
h += `<div class="row"><span class="lb">英語</span><button class="modeBtn" data-s="0">全部隠す</button><button class="modeBtn" data-s="1">ヒント</button><button class="modeBtn" data-s="2">全部表示</button></div></div>`;

// SEE 全文
if (D.see?.length) {
  h += `<section class="see"><h2>SEE — 教材の全文</h2>${D.see_lead ? `<div class="lead">${md(D.see_lead)}</div>` : ""}`;
  D.see.forEach(s => {
    if (s.heading) h += `<h3>${esc(s.heading)}</h3>`;
    h += `<div class="pair"><div class="en-v">${say(s.en)}${s.speaker ? `<span class="tag" style="margin:0 6px 0 0">${esc(s.speaker)}</span>` : ""}${md(s.en)}</div></div>`;
  });
  h += `</section>`;
}

talks.forEach((t, ti) => {
  h += `<div class="talk" data-i="${ti}">`;
  if (t.try?.length) {
    h += `<section><h2>TRY — Prepare for a role-play<span class="tag">${esc(t.name)}</span></h2>`;
    t.try.forEach((q, i) => {
      h += `<h3>Q${i + 1}. ${esc(q.q)}</h3>${q.q_student ? `<div class="qs">学生版: ${esc(q.q_student)}</div>` : ""}`;
      q.lines.forEach(l => h += pair(l));
    });
    h += `</section>`;
  }
  h += `<section><h2>ACT — 話す文<span class="tag">${esc(t.name)}</span></h2>${t.scene ? `<div class="scene">場面: ${md(t.scene)}</div>` : ""}`;
  h += `<div class="full">`;
  t.sections.forEach(s => h += `<div class="pair"><div class="lbl">${esc(s.heading)}</div><div class="ja">${md(s.lines.map(l => l.ja).join(""))}</div>${en(s.lines.map(l => l.en).join(" "))}</div>`);
  h += `</div></section>`;
  // ヒント欄
  if (t.typemap?.length || t.plus?.length) {
    h += `<section><h2>ヒント<span class="tag">${esc(t.name)}</span></h2>`;
        if (t.typemap?.length) h += `<h3>SEEの型 ⇔ 自分の文</h3><table><tr><th>SEEの型</th><th>自分の文</th></tr>${t.typemap.map(m => `<tr><td>${md(m.see)}</td><td>${md(m.mine)}</td></tr>`).join("")}</table>`;
    if (t.plus?.length) h += `<h3>＋α（型をもっと使うなら）</h3>${t.plus.map(p => `<div class="plus">${md(p)}</div>`).join("")}`;
    h += `</section>`;
  }
  h += `</div>`;
});

if (D.alts?.length) {
  h += `<section><h2>言い換えストック</h2><table><tr><th>表現</th><th>別の言い方</th></tr>`;
  D.alts.forEach(a => h += `<tr><td>${md(a.from)}</td><td>${md(a.to)}</td></tr>`);
  h += `</table></section>`;
}
if (D.notes?.length) h += `<section><h2>メモ</h2>${list(D.notes)}</section>`;

// 今回覚えたい英語表現
if (D.phrases?.length) {
  h += `<section id="phSec"><h2>今回覚えたい英語表現</h2><div class="lead">日本語を見て英語を言ってみる → タップで確認。言えたら「覚えた」。</div>`;
  h += `<div class="row" style="margin-bottom:6px"><button class="chip" id="hideDoneBtn">覚えたものを隠す</button><span class="lb" id="phCount"></span></div>`;
  D.phrases.forEach((p, i) => {
    h += `<div class="ph" data-i="${i}"><div class="top"><div class="ja">${md(p.ja)}${p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ""}</div><button class="done">覚えた</button></div>${en(p.en, p.hint)}`;
    if (p.note) h += `<div class="note">💡 ${md(p.note)}</div>`;
    if (p.ex) h += `<div class="ex">例: ${md(p.ex)}</div>`;
    h += `</div>`;
  });
  h += `</section>`;
}

const app = document.getElementById("app");
app.innerHTML = h;

// 読み上げ
// 読み上げ: 事前生成mp3（edge-tts Andrew）→ 無ければブラウザ読み上げ
let curAudio = null;
function speak(t){
  if (curAudio){ curAudio.pause(); curAudio = null; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const src = (D.audio || {})[t];
  if (src){ curAudio = new Audio(src); curAudio.play().catch(() => {}); return; }
  try{ const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = 0.95; speechSynthesis.speak(u); }catch(e){}
}
const setState = (el, s) => { el.classList.remove("s0", "s1", "s2"); el.classList.add("s" + s); };
document.addEventListener("click", e => {
  const sb = e.target.closest(".say"); if (sb){ e.stopPropagation(); speak(sb.dataset.say); return; }
  const b = e.target.closest(".en"); if (b){ const s = b.classList.contains("s0") ? 1 : b.classList.contains("s1") ? 2 : 0; setState(b, s); }
});
// 全部隠す／ヒント／全部表示
const modeBtns = [...document.querySelectorAll(".modeBtn")];
const setAll = s => { document.querySelectorAll(".en").forEach(x => setState(x, s)); modeBtns.forEach(m => m.classList.toggle("on", +m.dataset.s === s)); };
modeBtns.forEach(m => m.onclick = () => setAll(+m.dataset.s));
modeBtns[0].classList.add("on");
// パターン切り替え
const tabBtns = [...document.querySelectorAll(".tabBtn")];
const showTalk = i => { document.querySelectorAll(".talk").forEach(t => t.classList.toggle("on", +t.dataset.i === i)); tabBtns.forEach(b => b.classList.toggle("on", +b.dataset.i === i)); store.set("tab", i); };
tabBtns.forEach(b => b.onclick = () => showTalk(+b.dataset.i));
showTalk(Math.min(store.get("tab", 0), Math.max(talks.length - 1, 0)));
// 覚えた
const phSec = document.getElementById("phSec");
if (phSec) {
  let done = store.get("done", []);
  const refresh = () => { phSec.querySelectorAll(".ph").forEach(p => p.classList.toggle("isdone", done.includes(+p.dataset.i))); document.getElementById("phCount").textContent = `覚えた ${done.length} / ${D.phrases.length}`; };
  phSec.querySelectorAll(".done").forEach(btn => btn.onclick = () => { const i = +btn.closest(".ph").dataset.i; done = done.includes(i) ? done.filter(x => x !== i) : [...done, i]; store.set("done", done); refresh(); });
  const hdb = document.getElementById("hideDoneBtn");
  hdb.onclick = () => { const on = !phSec.classList.contains("hideDone"); phSec.classList.toggle("hideDone", on); hdb.classList.toggle("on", on); };
  refresh();
}
</script>
</body>
