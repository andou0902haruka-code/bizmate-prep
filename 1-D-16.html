<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Lesson 16 予習 — Explaining Unofficial Rules</title>
<style>
/* 学習ノート風: 落ち着いた紙色＋青のアクセント。色はすべてここで管理 */
:root{
  --bg:#f4f3ef;--card:#fffefb;--ink:#1e2228;--sub:#4a515c;--faint:#6a717c;--line:#dcd9d0;--line-soft:#e9e6de;
  --accent:#1d66a8;--accent-ink:#17599a;--accent-soft:#e7f0f8;--on-accent:#fff;
  --hide:#eceae3;--hide-ink:#5f6672;--ok:#21754a;--ok-soft:#e5f2ea;--on-ok:#fff;
  --src-note:#b8352a;--src-note-soft:#fbefed;--on-note:#fff;
  --src-theme:#6a45bd;--src-theme-soft:#f3eefb;--on-theme:#fff;
  --src-review:#1d7470;--src-review-soft:#e6f3f2;--on-review:#fff;
  --focus:#e08a00;--bar-h:56px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171b;--card:#1d2026;--ink:#e8eaed;--sub:#b4bac3;--faint:#99a0aa;--line:#353a44;--line-soft:#2a2e36;
  --accent:#72b4ec;--accent-ink:#8cc3f2;--accent-soft:#1d2e3f;--on-accent:#0f1720;
  --hide:#272b32;--hide-ink:#a3aab4;--ok:#57c486;--ok-soft:#1d3127;--on-ok:#0e1a13;
  --src-note:#f0897f;--src-note-soft:#33201f;--on-note:#1a0f0e;
  --src-theme:#b8a0f3;--src-theme-soft:#29233c;--on-theme:#150f24;
  --src-review:#6cc9c2;--src-review-soft:#183130;--on-review:#0c1a19;
  --focus:#ffb547;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:clamp(1rem,.94rem + .3vw,1.125rem);line-height:1.75}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 64px}
p{margin:0}
b{color:var(--accent-ink);font-weight:700}

/* ページ見出し */
.head{padding:20px 0 12px}
h1{font-size:1.4em;line-height:1.4;margin:0 0 6px;font-weight:700}
.meta{color:var(--sub);font-size:.9375em;line-height:1.6;display:flex;flex-wrap:wrap;gap:2px 14px}
.meta span{white-space:nowrap}
.meta span+span::before{content:"｜";margin-right:14px;color:var(--line)}
@media (max-width:599px){.meta span{white-space:normal}.meta span+span::before{display:none}.meta{flex-direction:column}}

/* 固定バー: 目次（既存の見出し）＋英語の全体切り替え。1行・高さ約56px */
.bar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px;padding:8px 16px;display:flex;align-items:center;gap:8px;min-height:var(--bar-h)}
.toc{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.toc.ovf{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent)}
.toc a{flex:none;display:inline-flex;align-items:center;min-height:40px;padding:0 10px;border-radius:8px;color:var(--sub);text-decoration:none;font-size:.875em;font-weight:600;white-space:nowrap}
.toc a:hover{background:var(--hide);color:var(--ink)}
.toc a[aria-current="true"]{color:var(--accent-ink);background:var(--accent-soft)}
.toc .long{font-weight:500}
@media (max-width:719px){.toc .long{display:none}.toc a{padding:0 6px}.seg button{padding:0 8px;font-size:.8125em}}
.seg{flex:none;display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;min-height:40px;padding:0 12px;font-size:.875em;font-weight:600;cursor:pointer;color:var(--sub);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg .lb{display:none}
@media (min-width:720px){.seg .lb{display:inline-flex;align-items:center;padding:0 4px 0 12px;font-size:.8125em;color:var(--faint)}}

/* セクション: 見出しで大きく区切る（カードは1セクション1枚だけ） */
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px 24px;margin:20px 0;scroll-margin-top:calc(var(--bar-h) + 12px)}
@media (max-width:599px){.sec{padding:16px 16px 20px;margin:16px 0;border-radius:10px}}
h2{font-size:1.3em;line-height:1.4;margin:0 0 12px;padding-bottom:10px;border-bottom:2px solid var(--line-soft);display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
h2 .k{color:var(--accent-ink)}
h3{font-size:1em;line-height:1.5;margin:0;font-weight:700}
.lead{color:var(--sub);font-size:.9375em;margin:0 0 14px}
.tag{display:inline-flex;align-items:center;font-size:.75rem;line-height:1;font-weight:600;padding:4px 8px;border-radius:5px;background:var(--hide);color:var(--hide-ink);white-space:nowrap;vertical-align:middle}
h2 .tag{font-size:.8125rem}

/* 読み上げボタン（英文の開閉とは別のボタン） */
.say{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;min-height:44px;padding:0 8px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-size:1rem;line-height:1}
.say:hover{border-color:var(--accent);background:var(--accent-soft)}
.say.playing{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.say .sl{font-size:.8125rem;font-weight:600;color:var(--sub)}

/* SEE: 常に表示 */
.see-it{padding:14px 0;border-top:1px solid var(--line-soft)}
.see-it:first-of-type{border-top:0;padding-top:4px}
.see-it.cont{border-top:0;padding-top:0}
.see-it h3{margin-bottom:6px;color:var(--sub)}
.see-row{display:flex;gap:12px;align-items:flex-start}
.see-en{flex:1;min-width:0;font-size:1.0625em;line-height:1.8;overflow-wrap:anywhere}
.see-en .tag{margin-right:8px;vertical-align:2px}

/* 英文の開閉（ACT・表現）: タップ／Enter／Spaceで 隠す⇄全文 */
.en{flex:1;min-width:0;border-radius:8px;padding:10px 14px;background:var(--accent-soft);border:1px solid transparent;cursor:pointer;font-size:1.0625em;line-height:1.75;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;user-select:text}
.en .txt{display:none}
.en .hint{display:none;color:var(--hide-ink);font-size:.875rem;font-weight:600;line-height:1.75}
.en.s2 .txt{display:inline}
.en.s0{background:var(--hide);border:1px dashed var(--line);user-select:none}
.en.s0 .hint{display:inline}
.en:hover{border-color:var(--accent)}

/* ACT */
.talk-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-size:.875em;font-weight:600;color:var(--sub)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.talk{display:none}.talk.on{display:block}
.scene{color:var(--sub);font-size:.9375em;margin:0 0 14px;padding:8px 12px;border-left:3px solid var(--line);background:var(--bg);border-radius:0 6px 6px 0}
.blk{padding:18px 0 4px;border-top:1px solid var(--line)}
.blk:first-of-type{border-top:0;padding-top:2px}
.blk-head{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.blk-head h3{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:1.0625em}
.blk-head h3::before{content:"";flex:none;width:4px;height:1.1em;border-radius:2px;background:var(--accent)}
.pair{display:grid;gap:6px;margin:0 0 16px;padding-left:12px;border-left:3px solid var(--line-soft)}
.pair .ja{font-size:1em;line-height:1.8}
@media (min-width:860px){.pair{grid-template-columns:1fr 1fr;gap:16px;align-items:start}.pair .ja{padding-top:10px}}
.len{color:var(--sub);font-size:.875em;margin-top:6px;padding-top:10px;border-top:1px solid var(--line-soft)}

/* TRY（任意・D.try があるときだけ）: 教材の VOCABULARY＋役の情報＋ノートに書いた自分の答え */
.vocab{display:grid;gap:8px;margin:0 0 16px}
@media (min-width:600px){.vocab{grid-template-columns:1fr 1fr}}
.voc{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line-soft);border-radius:8px;min-width:0}
.voc>div{flex:1;min-width:0}
.voc .v-en{font-weight:700;line-height:1.5;overflow-wrap:anywhere}
.voc .v-ja{color:var(--sub);font-size:.9375em;line-height:1.5}
.info{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:0 0 14px;padding:8px 12px;background:var(--bg);border-left:3px solid var(--line);border-radius:0 6px 6px 0;font-size:.9375em;line-height:1.6}
.info dt{color:var(--sub);font-weight:600}
.info dd{margin:0;overflow-wrap:anywhere}
@media (max-width:599px){.info{grid-template-columns:1fr}.info dd{margin-bottom:6px}}
.try-ex{margin:0 0 16px}

/* 言い換えストック */
.tbl{width:100%;border-collapse:collapse;font-size:.9375em;table-layout:fixed}
.tbl th,.tbl td{border-bottom:1px solid var(--line-soft);padding:8px 6px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.tbl th{color:var(--sub);font-weight:600;font-size:.875em}

/* 今回覚えたい表現: 出どころで色分け（ノート＝赤ペンの赤／テーマ＝紫）＋タグの文字 */
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.875em;color:var(--sub);margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.phtools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 12px}
.count{font-size:.9375em;font-weight:700;color:var(--ink)}
.count .bar-mini{display:inline-block;vertical-align:middle;width:80px;height:6px;border-radius:3px;background:var(--hide);margin-left:8px;overflow:hidden}
.count .bar-mini span{display:block;height:100%;background:var(--ok)}
.phlist{display:grid;gap:12px}
@media (min-width:860px){.phlist{grid-template-columns:1fr 1fr;align-items:start}}
.ph{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px 14px 14px;margin:0;background:var(--card);min-width:0}
.ph.src-note{border-left-color:var(--src-note)}
.ph.src-theme{border-left-color:var(--src-theme)}
.ph.src-note .tag{background:var(--src-note);color:var(--on-note)}
.ph.src-theme .tag{background:var(--src-theme);color:var(--on-theme)}
.ph-head{display:flex;align-items:flex-start;gap:10px;margin:0 0 8px}
.ph-head .tag{margin-top:5px}
.ph-head .ja{flex:1;min-width:0;font-weight:700;font-size:1.125em;line-height:1.6;padding-top:1px;overflow-wrap:anywhere}
.done{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--sub);font-size:.875em;font-weight:700;cursor:pointer;white-space:nowrap}
.done:hover{border-color:var(--ok);color:var(--ok)}
.done .box{display:inline-flex;align-items:center;justify-content:center;width:1.15em;height:1.15em;border:1.5px solid currentColor;border-radius:4px;font-size:.9em;line-height:1}
.done[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.ph.isdone{background:var(--ok-soft)}
.en-row{display:flex;gap:8px;align-items:flex-start}
.ph-sub{margin-top:10px;padding-left:2px;display:grid;gap:4px}
.ph-sub .note,.ph-sub .ex{font-size:.96875em;line-height:1.75;color:var(--sub);overflow-wrap:anywhere}
.ph-sub .ex{color:var(--ink)}
.hideDone .ph.isdone{display:none}

/* 前回の復習: 前回のノート左下の表現（ティール） */
.rvlist{display:grid;gap:12px}
@media (min-width:860px){.rvlist{grid-template-columns:1fr 1fr;align-items:start}}
.rv{border:1px solid var(--line);border-left:5px solid var(--src-review);border-radius:10px;padding:12px 14px 14px;margin:0;background:var(--card);min-width:0}
.rv .tag{background:var(--src-review);color:var(--on-review)}
.rv-head{display:flex;align-items:flex-start;gap:10px;margin:0 0 8px}
.rv-head .tag{margin-top:5px}
.rv-head .ja{flex:1;min-width:0;font-weight:700;font-size:1.125em;line-height:1.6;padding-top:1px;overflow-wrap:anywhere}
.rv .ph-sub{margin-top:10px}

/* メモ */
.memo{margin:0;padding-left:1.4em}
.memo li{margin:0 0 10px;line-height:1.8}
.memo li::marker{color:var(--faint)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
<style>
.lnav{max-width:880px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.875em;color:var(--sub)}
.lnav label{font-weight:600}
.lnav select{font:inherit;min-height:40px;max-width:100%;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.lnav .new{color:var(--accent-ink);font-weight:700}
</style>
</head>

// 読み上げ: 事前生成mp3（edge-tts Andrew）→ 無い・読み込めないときはブラウザ読み上げ
let curAudio = null, curBtn = null;
const mark = b => { if (curBtn) curBtn.classList.remove("playing"); curBtn = b; if (b) b.classList.add("playing"); };
function tts(t, btn){
  try{
    const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = 0.95;
    u.onend = u.onerror = () => { if (curBtn === btn) mark(null); };
    speechSynthesis.speak(u);
  }catch(e){ mark(null); }
}
function stopAudio(){
  if (curAudio){ curAudio.pause(); curAudio = null; }
  try{ speechSynthesis.cancel(); }catch(e){}
  mark(null);
}
function speak(t, btn){
  stopAudio();
  mark(btn);
  const src = (D.audio || {})[t];
  if (!src){ tts(t, btn); return; }
  const a = new Audio(src); curAudio = a;
  let fell = false;
  const fallback = () => { if (fell || curAudio !== a) return; fell = true; curAudio = null; tts(t, btn); };
  a.onerror = fallback;
  a.onended = () => { if (curAudio === a){ curAudio = null; mark(null); } };
  a.play().catch(err => { if (err && err.name === "AbortError") return; fallback(); });
}

// 英文の開閉
const enEls = [...document.querySelectorAll(".en")];
const modeBtns = [...document.querySelectorAll(".modeBtn")];
const setState = (el, s) => { el.classList.remove("s0", "s2"); el.classList.add("s" + s); el.setAttribute("aria-expanded", s === 2 ? "true" : "false"); };
// 全体ボタンの選択中表示は実際の状態に合わせる（全部隠れている／全部出ている／混在＝どちらも非選択）
const syncMode = () => {
  const shown = enEls.filter(x => x.classList.contains("s2")).length;
  const s = shown === 0 ? 0 : shown === enEls.length ? 2 : -1;
  modeBtns.forEach(m => m.setAttribute("aria-pressed", +m.dataset.s === s ? "true" : "false"));
};
const toggleEn = b => { setState(b, b.classList.contains("s0") ? 2 : 0); syncMode(); };
document.addEventListener("click", e => {
  const sb = e.target.closest(".say"); if (sb){ e.stopPropagation(); if (sb === curBtn) stopAudio(); else speak(sb.dataset.say, sb); return; }
  const b = e.target.closest(".en");
  if (b){ if (b.classList.contains("s2") && String(getSelection()).trim()) return; toggleEn(b); } // 文字を選択中は閉じない
});
document.addEventListener("keydown", e => {
  const b = e.target.closest?.(".en");
  if (b && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); toggleEn(b); }
});
// 全部隠す／全部表示（復習・ACT・表現の英文が対象。SEEは常に表示）
const setAll = s => { enEls.forEach(x => setState(x, s)); syncMode(); };
modeBtns.forEach(m => m.onclick = () => setAll(+m.dataset.s));
syncMode();
// パターン切り替え
const tabBtns = [...document.querySelectorAll(".tabBtn")];
const showTalk = i => { document.querySelectorAll(".talk").forEach(t => t.classList.toggle("on", +t.dataset.i === i)); tabBtns.forEach(b => b.setAttribute("aria-pressed", +b.dataset.i === i ? "true" : "false")); store.set("tab", i); };
tabBtns.forEach(b => b.onclick = () => showTalk(+b.dataset.i));
showTalk(Math.min(store.get("tab", 0), Math.max(talks.length - 1, 0)));
// 覚えた
const phSec = document.getElementById("phSec");
if (phSec) {
  let done = store.get("done", []);
  const refresh = () => {
    phSec.querySelectorAll(".ph").forEach(p => {
      const on = done.includes(+p.dataset.i);
      p.classList.toggle("isdone", on);
      const b = p.querySelector(".done");
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.innerHTML = `<span class="box" aria-hidden="true">${on ? "✓" : ""}</span>覚えた`;
    });
    const n = done.filter(i => i >= 0 && i < D.phrases.length).length;
    document.getElementById("phCount").innerHTML = `覚えた ${n} / ${D.phrases.length}<span class="bar-mini" aria-hidden="true"><span style="width:${Math.round(n / D.phrases.length * 100)}%"></span></span>`;
  };
  phSec.querySelectorAll(".done").forEach(btn => btn.onclick = () => { const i = +btn.closest(".ph").dataset.i; done = done.includes(i) ? done.filter(x => x !== i) : [...done, i]; store.set("done", done); refresh(); });
  const hdb = document.getElementById("hideDoneBtn");
  hdb.onclick = () => { const on = !phSec.classList.contains("hideDone"); phSec.classList.toggle("hideDone", on); hdb.setAttribute("aria-pressed", on ? "true" : "false"); };
  refresh();
}
// 目次: いま読んでいるセクションを示す
const tocLinks = [...document.querySelectorAll(".toc a")];
if ("IntersectionObserver" in window && tocLinks.length) {
  const io = new IntersectionObserver(es => es.forEach(x => {
    if (!x.isIntersecting) return;
    tocLinks.forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + x.target.id ? "true" : "false"));
  }), { rootMargin: "-30% 0px -60% 0px" });
  tocLinks.forEach(a => { const s = document.querySelector(a.getAttribute("href")); if (s) io.observe(s); });
}
// 目次が幅に収まらないときだけ横スワイプ（右端をぼかして続きを示す）。今のセクションのリンクは見える位置へ
const toc = document.querySelector(".toc");
const tocFit = () => toc.classList.toggle("ovf", toc.scrollWidth > toc.clientWidth + 1 && toc.scrollLeft + toc.clientWidth < toc.scrollWidth - 1);
if (toc){ tocFit(); addEventListener("resize", tocFit); toc.addEventListener("scroll", tocFit, { passive: true });
  new MutationObserver(() => { const a = toc.querySelector('[aria-current="true"]'); if (a && toc.scrollWidth > toc.clientWidth) toc.scrollTo({ left: a.offsetLeft - 16 }); }).observe(toc, { subtree: true, attributeFilter: ["aria-current"] }); }
</script>
</body>
